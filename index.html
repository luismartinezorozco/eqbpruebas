<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://www.image2url.com/r2/default/images/1788374834690-45577bd2-1651-4ed7-ad3b-d8813e90ef11.svg">
    <!-- Bloqueo de zoom para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>LALY TALENTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Íconos modernos (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3ebe3; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
        ::selection { background: rgba(187, 116, 52, 0.35); }
        h1, h2 { letter-spacing: -0.025em; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ Micro-interacciones globales ============ */
        #login-screen button, #app-layout button, #worker-modal button,
        #worker-modal label, #main-content label {
            transition-property: all; transition-duration: 0.3s; transition-timing-function: ease-out;
        }
        #login-screen button:active, #app-layout button:active, #worker-modal button:active,
        #worker-modal label:active, #main-content label:active { transform: scale(0.95); }

        /* ============ Tarjetas clickeables (Dashboard / Directorio / Ranking) ============ */
        #main-content .card-shadow { transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
        #main-content .card-shadow.cursor-pointer:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(84, 44, 28, 0.15), 0 4px 12px rgb(0, 0, 0, 0.04);
            border-color: rgba(187, 116, 52, 0.6);
        }
        #main-content .card-shadow.cursor-pointer:active { transform: scale(0.97); }

        /* ============ Navegación ============ */
        #desktop-nav button { transition: all 0.3s ease-out; }
        #desktop-nav button:hover { transform: translateX(3px); }
        #desktop-nav button:active { transform: scale(0.97); }
        #mobile-nav button { transition: all 0.3s ease-out; }
        #mobile-nav button:active { transform: scale(0.9); }
        #mobile-nav button > div { transition: all 0.35s cubic-bezier(0.34, 1.4, 0.64, 1); }
        #mobile-nav button[class*="text-[#542c1c]"] > div { transform: scale(1.08); }
        .nav-safe { bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px)); }

        /* ============ Formularios modernos (modal, login y vistas generadas) ============ */
        #worker-modal input:not([type="hidden"]):not([type="file"]), #worker-modal select,
        #main-content input, #main-content select { transition: all 0.3s ease-out; }
        #worker-modal input:not([type="hidden"]):not([type="file"]), #worker-modal select {
            background-color: rgba(249, 250, 251, 0.55); border-color: transparent;
        }
        #worker-modal input:not([type="hidden"]):not([type="file"]):focus, #worker-modal select:focus,
        #main-content input:focus, #main-content select:focus {
            background-color: #ffffff; border-color: transparent;
            box-shadow: 0 0 0 3px rgba(187, 116, 52, 0.45); outline: none;
        }

        /* ============ Login premium ============ */
        #login-screen {
            background:
                radial-gradient(55rem 32rem at 12% 8%, rgba(187, 116, 52, 0.16), transparent 55%),
                radial-gradient(45rem 30rem at 92% 95%, rgba(187, 116, 52, 0.10), transparent 55%),
                #542c1c;
        }

        /* ============ Cabecera marrón de impacto (Dashboard) ============ */
        #main-content [class*="bg-[#542c1c]"]:not(button) {
            background: linear-gradient(135deg, #542c1c 0%, #6b3c2a 55%, #7a4a35 100%);
            box-shadow: 0 14px 34px -14px rgba(84, 44, 28, 0.4);
        }

        /* ============ Perfil: secciones tipo bento también en móvil ============ */
        #main-content [class*="md:rounded-3xl"][class*="shadow-sm"] {
            border-radius: 1.5rem; background: #ffffff;
            border: 1px solid rgba(243, 244, 246, 0.7);
            box-shadow: 0 8px 30px rgb(0, 0, 0, 0.04);
        }

        /* ============ Modal con glassmorphism ============ */
        .modal-backdrop {
            position: fixed; inset: 0; background-color: rgba(84, 44, 28, 0.45);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease; padding: 1rem;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%; max-width: 36rem; border-radius: 1.75rem; max-height: 90vh;
            display: flex; flex-direction: column; transform: scale(0.95) translateY(12px);
            transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
            overflow: hidden;
            box-shadow: 0 24px 60px -12px rgba(84, 44, 28, 0.28), 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .modal-backdrop.active .modal-content { transform: scale(1) translateY(0); }
        #worker-modal .card-shadow { background-color: rgba(255, 255, 255, 0.85); }

        /* ============ Sombras premium multi-capa (todas las tarjetas) ============ */
        .card-shadow { box-shadow: 0 8px 30px rgb(0, 0, 0, 0.04), 0 1px 2px rgb(0, 0, 0, 0.02); border: 1px solid rgba(243, 244, 246, 0.7); }

        /* ============ Skeleton Loading Animation ============ */
        @keyframes skeleton-loading { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .skeleton-base { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 1000px 100%; animation: skeleton-loading 2s infinite; border-radius: 0.75rem; }
        .skeleton-text { height: 1rem; margin-bottom: 0.5rem; }
        .skeleton-card { padding: 1.25rem; margin-bottom: 1rem; border-radius: 1.5rem; background: white; border: 1px solid rgba(243, 244, 246, 0.7); }
        .skeleton-card .skeleton-base { height: 2rem; margin-bottom: 0.75rem; }

        /* ============ Responsive Text Sizing ============ */
        .text-responsive-h1 { font-size: clamp(1.5rem, 5vw, 3rem); }
        .text-responsive-h2 { font-size: clamp(1.25rem, 4vw, 2rem); }
        .text-responsive-h3 { font-size: clamp(1rem, 3vw, 1.5rem); }
        
        /* ============ Mobile First Spacing ============ */
        .safe-padding-mobile { padding: 1rem; }
        @media (min-width: 768px) { .safe-padding-mobile { padding: 1.5rem; } }
        @media (min-width: 1024px) { .safe-padding-mobile { padding: 2rem; } }
        
        /* ============ Botones Responsive (min 44px touch target) ============ */
        button { min-height: 44px; }
        input, select, textarea { min-height: 44px; }
        .login-type-btn { transition: all 0.3s ease-out; border-width: 2px; }
        .login-type-btn.active { background-color: #bb7434; border-color: #bb7434; color: #fff; }
        .login-type-btn.inactive { background-color: transparent; border-color: #ddd; color: #999; }
        .login-type-btn:hover:not(.inactive) { transform: translateY(-2px); }
    </style>
</head>
<body class="overflow-hidden">

    <div id="login-screen" class="fixed inset-0 min-h-[100dvh] bg-[#542c1c] flex flex-col items-center justify-center p-4 md:p-6 fade-in z-[300] overflow-y-auto">
        <div class="w-16 h-16 md:w-20 md:h-20 bg-[#bb7434] rounded-3xl flex items-center justify-center text-white mb-6 md:mb-8 shadow-[0_0_40px_rgba(187,116,52,0.3)] ring-4 ring-[#bb7434]/20">
           <i data-lucide="briefcase" style="width: 32px; height: 32px; min-width: 32px;"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-black text-white mb-1 sm:mb-2 tracking-tight text-center">LALY TALENTO</h1>
        <p class="text-[#cab2a2] font-medium mb-6 sm:mb-8 text-center max-w-sm text-xs sm:text-sm md:text-base">Sistema de gestión de talento y rendimiento.</p>
        
        <div class="bg-white rounded-2xl sm:rounded-[2rem] p-4 sm:p-6 md:p-8 w-full max-w-sm shadow-[0_25px_60px_-15px_rgba(0,0,0,0.4)] border border-white/20">
          <h2 class="text-lg sm:text-xl md:text-2xl font-black text-[#542c1c] mb-4 sm:mb-6 text-center">¿Quién eres?</h2>
          
          <!-- Selector Admin/Colaborador -->
          <div class="flex gap-2 mb-4 sm:mb-6 md:mb-8">
            <button type="button" id="login-type-admin" onclick="window.switchLoginType('admin')" class="flex-1 login-type-btn active border-2 py-2 sm:py-2.5 md:py-3 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm md:text-base flex items-center justify-center gap-1 sm:gap-2 transition-all flex-col sm:flex-row">
              <i data-lucide="shield" class="w-4 h-4 md:w-5 md:h-5"></i> <span>Administrador</span>
            </button>
            <button type="button" id="login-type-worker" onclick="window.switchLoginType('worker')" class="flex-1 login-type-btn inactive border-2 py-2 sm:py-2.5 md:py-3 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm md:text-base flex items-center justify-center gap-1 sm:gap-2 transition-all flex-col sm:flex-row">
              <i data-lucide="briefcase" class="w-4 h-4 md:w-5 md:h-5"></i> <span>Colaborador</span>
            </button>
          </div>

          <!-- Formulario Admin -->
          <form id="login-form-admin" onsubmit="window.handleLogin(event)" class="space-y-3 sm:space-y-4 md:space-y-6">
            <div class="text-left">
              <label class="block text-xs font-bold text-gray-500 mb-1.5 sm:mb-2 uppercase tracking-wide">Usuario</label>
              <input type="text" id="login-username" placeholder="Usuario" class="w-full border border-transparent bg-gray-50/50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-[#bb7434]/50 focus:border-transparent font-medium transition-all duration-300 ease-out" />
            </div>
            <div class="text-left">
              <label class="block text-xs font-bold text-gray-500 mb-1.5 sm:mb-2 uppercase tracking-wide">Contraseña</label>
              <input type="password" id="login-password" placeholder="Contraseña" class="w-full border border-transparent bg-gray-50/50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-[#bb7434]/50 focus:border-transparent font-medium transition-all duration-300 ease-out" />
            </div>
            <button type="submit" id="login-btn" class="w-full bg-[#bb7434] text-white py-2.5 sm:py-3 md:py-3.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm md:text-base hover:bg-[#a55f25] transition-all duration-300 ease-out shadow-lg shadow-[#bb7434]/30 hover:shadow-xl hover:shadow-[#bb7434]/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] disabled:opacity-70 disabled:cursor-wait">
              Ingresar
            </button>
          </form>

          <!-- Formulario Colaborador -->
          <form id="login-form-worker" onsubmit="window.handleLogin(event)" class="space-y-3 sm:space-y-4 md:space-y-6 hidden">
            <div class="text-left">
              <label class="block text-xs font-bold text-gray-500 mb-1.5 sm:mb-2 uppercase tracking-wide">Número de Documento</label>
              <input type="number" id="login-cedula" placeholder="Cédula" class="w-full border border-transparent bg-gray-50/50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-[#bb7434]/50 focus:border-transparent font-medium transition-all duration-300 ease-out" />
            </div>
            <button type="submit" id="login-btn" class="w-full bg-[#bb7434] text-white py-2.5 sm:py-3 md:py-3.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm md:text-base hover:bg-[#a55f25] transition-all duration-300 ease-out shadow-lg shadow-[#bb7434]/30 hover:shadow-xl hover:shadow-[#bb7434]/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] disabled:opacity-70 disabled:cursor-wait">
              Ingresar
            </button>
          </form>
        </div>
    </div>

    <div id="app-layout" class="hidden flex h-[100dvh] w-full bg-[#542c1c] overflow-hidden relative">
        
        <!-- SIDEBAR (PC) -->
        <div class="hidden lg:flex flex-col w-64 xl:w-72 bg-[#542c1c] text-white pt-6 md:pt-8 pb-4 md:pb-6 px-4 md:px-6 border-r border-[#7a4a35] relative z-20 shrink-0">
            <div class="mb-8 md:mb-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-[#bb7434] rounded-xl flex items-center justify-center text-white shadow-lg shadow-[#bb7434]/25 shrink-0">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0">
                    <h2 class="text-lg md:text-xl font-black tracking-tight leading-tight truncate">LALY</h2>
                    <p class="text-[10px] text-[#cab2a2] uppercase font-bold tracking-widest">Talento</p>
                </div>
            </div>

            <nav id="desktop-nav" class="flex-1 space-y-1 md:space-y-2">
                <!-- Nav items inyectados por JS -->
            </nav>

            <div class="mt-auto bg-white/5 backdrop-blur-sm p-3 md:p-4 rounded-3xl border border-white/10">
                <div class="flex items-center gap-3 mb-3 min-w-0">
                    <div id="user-avatar" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-[#542c1c] font-bold overflow-hidden ring-2 ring-[#bb7434]/40 shadow-md shrink-0">U</div>
                    <div class="flex-1 min-w-0">
                      <p id="user-name" class="text-sm font-bold truncate">Usuario</p>
                      <p id="user-role" class="text-[10px] text-[#cab2a2] font-black uppercase tracking-wider">Rol</p>
                    </div>
                </div>
                <button onclick="window.appSignOut()" class="w-full flex items-center justify-center gap-2 text-xs font-bold text-gray-300 hover:text-white bg-white/10 hover:bg-white/20 py-2 px-2 md:py-2.5 md:px-3 rounded-xl transition-all duration-300 ease-out active:scale-95">
                    <i data-lucide="log-out" class="w-4 h-4 shrink-0"></i> <span class="hidden sm:inline">Cerrar</span>
                </button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col h-[100dvh] bg-[#f3ebe3] lg:rounded-l-[2.5rem] overflow-hidden relative shadow-2xl lg:border-l lg:border-white/10">
            
            <div id="main-content" class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 lg:p-8 relative pb-24 sm:pb-28 md:pb-10 hide-scrollbar">
                <!-- Vistas dinámicas inyectadas aquí -->
            </div>

            <!-- BOTTOM NAV (Móvil + Tablet) -->
            <div class="lg:hidden fixed nav-safe left-3 right-3 sm:left-4 sm:right-4 bg-white/75 backdrop-blur-xl border border-white/60 px-2 py-2 sm:py-3 rounded-[2rem] shadow-[0_12px_40px_-8px_rgba(84,44,28,0.18),0_4px_12px_rgba(84,44,28,0.06)] z-[200]">
                <div id="mobile-nav" class="flex justify-around items-center w-full">
                    <!-- Nav items inyectados por JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FORMULARIO COLABORADOR -->
    <div id="worker-modal" class="modal-backdrop">
        <div class="modal-content w-full sm:w-auto sm:max-w-sm md:max-w-md">
            <div class="flex justify-between items-center p-4 sm:p-6 border-b border-gray-100/80 shrink-0 bg-white/70 backdrop-blur-xl">
                <h3 id="worker-modal-title" class="font-black text-lg sm:text-xl text-[#542c1c]">Nuevo Colaborador</h3>
                <button onclick="document.getElementById('worker-modal').classList.remove('active')" class="p-2 hover:bg-gray-100 rounded-full text-gray-500 transition-all duration-300 ease-out hover:rotate-90 active:scale-90 shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-3 sm:p-5 md:p-6 overflow-y-auto flex-1 hide-scrollbar bg-gray-50/60">
                <form id="worker-form" onsubmit="window.saveWorker(event)" class="space-y-3 sm:space-y-4">
                    <input type="hidden" id="w-id">
                    
                    <!-- FOTO -->
                    <div class="flex flex-col items-center mb-3 sm:mb-4">
                        <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gray-200 border-4 border-white shadow-md flex items-center justify-center overflow-hidden mb-2">
                            <img id="w-photo-preview" src="" class="w-full h-full object-cover hidden">
                            <i id="w-photo-icon" data-lucide="camera" class="w-5 h-5 sm:w-6 sm:h-6 text-gray-400"></i>
                        </div>
                        <label class="cursor-pointer text-[#542c1c] text-xs font-bold py-1.5 px-2.5 sm:px-3 rounded-full bg-white shadow-sm border border-gray-200 hover:bg-gray-50 hover:shadow-md transition-all duration-300 ease-out active:scale-95">
                            Subir Foto
                            <input type="file" accept="image/jpeg, image/png" class="hidden" onchange="window.handlePhotoUpload(event)">
                        </label>
                        <input type="hidden" id="w-photo-base64">
                    </div>

                    <div class="bg-white p-3 sm:p-4 rounded-xl sm:rounded-2xl card-shadow">
                        <h4 class="font-bold text-[#542c1c] mb-2.5 sm:mb-3 text-xs sm:text-sm uppercase tracking-wide">Datos Personales</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
                            <div><input required id="w-name" placeholder="Nombres" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input required id="w-lastname" placeholder="Apellidos" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input type="date" id="w-birthday" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input type="number" required id="w-doc" placeholder="Cédula" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input type="email" id="w-email" placeholder="Email" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input type="number" required id="w-phone" placeholder="Teléfono" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><select id="w-bloodtype" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"><option value="">Sangre</option><option value="O+">O+</option><option value="O-">O-</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select></div>
                            <div><input id="w-eps" placeholder="EPS" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div class="sm:col-span-2"><input id="w-address" placeholder="Dirección" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input id="w-city" placeholder="Ciudad" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input id="w-emergency-name" placeholder="Emergencia (nombre)" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                            <div><input type="number" id="w-emergency-phone" placeholder="Tel. emergencia" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>
                        </div>
                    </div>

                    <div class="bg-white p-3 sm:p-4 rounded-xl sm:rounded-2xl card-shadow">
                        <h4 class="font-bold text-[#542c1c] mb-2.5 sm:mb-3 text-xs sm:text-sm uppercase tracking-wide">Información Laboral</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
                            <div>
                                <select id="w-role" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm font-bold text-[#542c1c] focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors">
                                    <option value="Colaborador">Colaborador</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </div>
                            <div>
                                <select id="w-status" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm font-bold text-gray-600 focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors">
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <input id="w-specs" placeholder="Especialidades" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors">
                            </div>
                            <div class="sm:col-span-2">

                                <div class="space-y-1.5 sm:space-y-2">

                                <select id="w-bank-type" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors">

                            <div class="sm:col-span-2"><input type="number" id="w-bank-num" placeholder="Número de Cuenta" class="w-full border border-gray-200 bg-gray-50 rounded-lg sm:rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm focus:bg-white focus:border-[#bb7434] focus:outline-none transition-colors"></div>

                    <div class="pt-2 pb-3">
                        <button type="submit" id="save-worker-btn" class="w-full bg-[#7be4af] text-[#542c1c] py-2.5 sm:py-3 md:py-4 rounded-lg sm:rounded-xl font-black text-sm sm:text-base hover:bg-[#66d19c] transition-all duration-300 ease-out shadow-lg shadow-[#7be4af]/25 hover:shadow-xl hover:shadow-[#7be4af]/35 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] disabled:opacity-70">Guardar</button>

    </div>

    <!-- Contenedor para Notificaciones Tipo Toast -->
    <div id="toast-container" class="fixed bottom-24 md:bottom-10 left-1/2 transform -translate-x-1/2 z-[1500] flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm items-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, query, where, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4N-DtD-dPaF4r2TIU2Vsk8nlEHtEnAss",
            authDomain: "recursoslaly.firebaseapp.com",
            projectId: "recursoslaly",
            storageBucket: "recursoslaly.firebasestorage.app",
            messagingSenderId: "49889283141",
            appId: "1:49889283141:web:9cc349b9d814855f07a72c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.appState = {
            currentUser: null,
            currentView: 'dashboard',
            selectedWorker: null,
            selectedMonth: new Date().toISOString().slice(0, 7),
            dbWorkers: [],
            points: [],
            currentProfileDocs: [],
            activeProfileTab: 'rendimiento',
            loginType: 'admin'
        };

        window.getInitials = (name) => {
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return 'US';
        };

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-2xl text-sm font-bold shadow-xl transition-all duration-300 transform translate-y-4 opacity-0 flex items-center gap-3 w-full max-w-sm ${
                type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-800 text-white'
            }`;
            const iconColor = type === 'error' ? 'text-white' : 'text-[#7be4af]';
            toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 ${iconColor} shrink-0"></i> <span class="flex-1 min-w-0 truncate break-words whitespace-normal">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.onload = async () => {
            lucide.createIcons();
            try {
                await signInAnonymously(auth);
                checkSession();
            } catch (error) {
                window.showToast("Error de conexión a Firebase", "error");
            }
        };

        async function fetchAllData() {
            try {
                const wSnap = await getDocs(collection(db, "workers"));
                window.appState.dbWorkers = wSnap.docs.map(doc => doc.data());
                
                const pSnap = await getDocs(collection(db, "points"));
                window.appState.points = pSnap.docs.map(doc => ({dbId: doc.id, ...doc.data()}));
            } catch (e) { console.error(e); }
        }

        async function checkSession() {
            const session = sessionStorage.getItem('hr_v2_session');
            if (session) {
                window.appState.currentUser = JSON.parse(session);
                performLoginUIFast();
                fetchAllData().then(() => renderViewAfterLogin()).catch(e => console.error(e));
            }
        }

        function showSkeletonDashboard() {
            return `
            <div class="space-y-6 animate-pulse">
                <div class="bg-gradient-to-r from-[#542c1c] to-[#146459] -mx-6 md:-mx-8 -mt-6 md:-mt-8 pt-12 pb-10 px-6 md:px-10 rounded-b-[2rem]">
                    <div class="max-w-5xl mx-auto">
                        <div class="skeleton-base h-10 mb-3" style="width: 200px;"></div>
                        <div class="skeleton-base h-6 mb-8" style="width: 150px;"></div>
                        <div class="flex gap-12">
                            <div><div class="skeleton-base h-12 mb-2" style="width: 80px;"></div><div class="skeleton-base h-4" style="width: 100px;"></div></div>
                            <div><div class="skeleton-base h-12 mb-2" style="width: 80px;"></div><div class="skeleton-base h-4" style="width: 100px;"></div></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="skeleton-card"><div class="skeleton-base h-16"></div><div class="skeleton-base h-4 w-2/3"></div></div>
                    <div class="skeleton-card"><div class="skeleton-base h-16"></div><div class="skeleton-base h-4 w-2/3"></div></div>
                </div>
            </div>`;
        }

        function showSkeletonDirectory() {
            return `
            <div class="space-y-6 animate-pulse">
                <div class="skeleton-base h-10 w-1/3 mb-6"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    ${Array(6).fill(0).map(() => `<div class="skeleton-card"><div class="skeleton-base h-20"></div><div class="skeleton-base h-4 mt-2 w-3/4"></div></div>`).join('')}
                </div>
            </div>`;
        }

        function showSkeletonRanking() {
            return `
            <div class="space-y-6 animate-pulse">
                <div class="skeleton-base h-10 w-1/3 mb-6"></div>
                <div class="space-y-3">
                    ${Array(5).fill(0).map(() => `<div class="skeleton-card h-16"></div>`).join('')}
                </div>
            </div>`;
        }

        function showSkeletonProfile() {
            return `
            <div class="space-y-6 animate-pulse">
                <div class="bg-white px-5 md:px-10 pt-8 pb-6 rounded-3xl md:mt-2">
                    <div class="flex gap-4 md:gap-6">
                        <div class="skeleton-base w-20 h-20 md:w-28 md:h-28 rounded-3xl"></div>
                        <div class="flex-1"><div class="skeleton-base h-8 mb-2 w-2/3"></div><div class="skeleton-base h-4 w-1/2"></div></div>
                    </div>
                </div>
                <div class="space-y-3">
                    ${Array(4).fill(0).map(() => `<div class="skeleton-card h-20"></div>`).join('')}
                </div>
            </div>`;
        }

        function performLoginUIFast() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            const user = window.appState.currentUser;
            document.getElementById('user-name').innerText = user.name;
            const photoEl = document.getElementById('user-avatar');
            if(user.photo) {
                photoEl.innerHTML = `<img src="${user.photo}" class="w-full h-full object-cover">`;
            } else {
                photoEl.innerText = window.getInitials(user.name);
            }
            document.getElementById('user-role').innerText = user.role;
            window.renderNav();
            const mainContent = document.getElementById('main-content');
            const isWorker = window.appState.currentUser.systemRole === 'WORKER';
const skeleton = isWorker ? showSkeletonProfile() : showSkeletonDashboard();
mainContent.innerHTML = '<div class="p-4 md:p-6 space-y-4"><div class="flex items-center justify-center gap-3 mb-6"><i data-lucide="loader-2" class="w-5 h-5 animate-spin text-[#bb7434]"></i><p class="text-gray-500 font-medium text-sm">Sincronizando datos...</p></div>' + skeleton + '</div>';
            lucide.createIcons();
        }

        function renderViewAfterLogin() {
            const user = window.appState.currentUser;
            if (user.systemRole === 'WORKER') {
                window.appState.selectedWorker = user;
                window.setView('profile');
            } else {
                window.setView('dashboard');
            }
        }

        window.switchLoginType = (type) => {
            const adminBtn = document.getElementById('login-type-admin');
            const workerBtn = document.getElementById('login-type-worker');
            const adminForm = document.getElementById('login-form-admin');
            const workerForm = document.getElementById('login-form-worker');
            
            if (type === 'admin') {
                adminBtn.classList.add('active'); adminBtn.classList.remove('inactive');
                workerBtn.classList.remove('active'); workerBtn.classList.add('inactive');
                adminForm.classList.remove('hidden');
                workerForm.classList.add('hidden');
                window.appState.loginType = 'admin';
            } else {
                adminBtn.classList.remove('active'); adminBtn.classList.add('inactive');
                workerBtn.classList.add('active'); workerBtn.classList.remove('inactive');
                adminForm.classList.add('hidden');
                workerForm.classList.remove('hidden');
                window.appState.loginType = 'worker';
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const loginType = window.appState.loginType || 'admin';
            
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
            lucide.createIcons();
            btn.disabled = true;

            try {
                let user = null;

                if (loginType === 'admin') {
                    // Login de Administrador con usuario/contraseña
                    const username = document.getElementById('login-username').value.trim();
                    const password = document.getElementById('login-password').value.trim();
                    
                    // Credenciales codificadas en Base64 (seguridad básica - no es encriptación real)
                    // Para cambiar: codifica "usuario|contraseña" en base64 en https://www.base64encode.org
                    const encodedCredentials = 'MTAwNzExNzk1M3xMbTE3QDUqKg=='; // 1007117953|Lm17@5**
                    const [validUser, validPass] = atob(encodedCredentials).split('|');
                    
                    if (username === validUser && password === validPass) {
                        user = {
                            id: 'admin_' + username,
                            name: 'Administrador',
                            username: username,
                            role: 'Administrador',
                            systemRole: 'ADMIN',
                            status: 'activo',
                            isAdmin: true
                        };
                    } else {
                        window.showToast('Usuario o contraseña incorrectos', 'error');
                        btn.innerHTML = 'Ingresar'; btn.disabled = false;
                        return;
                    }
                } else {
                    // Login de Colaborador con documento
                    const docInput = document.getElementById('login-cedula').value.trim();
                    
                    if (!docInput) {
                        window.showToast('Ingresa tu número de documento', 'error');
                        btn.innerHTML = 'Ingresar'; btn.disabled = false;
                        return;
                    }

                    const q = query(collection(db, "workers"), where("document", "==", docInput), where("status", "==", "activo"));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        user = querySnapshot.docs[0].data();
                        // Normalizar roles
                        if(!user.systemRole) {
                            if(user.role === 'Administrador') user.systemRole = 'ADMIN';
                            else if(user.role === 'Colaborador') user.systemRole = 'WORKER';
                            else user.systemRole = 'WORKER';
                        }
                    } else {
                        window.showToast('Documento no encontrado o inactivo', 'error');
                        btn.innerHTML = 'Ingresar'; btn.disabled = false;
                        return;
                    }
                }

                if (user) {
                    window.appState.currentUser = user;
                    sessionStorage.setItem('hr_v2_session', JSON.stringify(user));
                    performLoginUIFast();
                    fetchAllData().then(() => renderViewAfterLogin()).catch(e => console.error(e));
                }
            } catch (error) { 
                console.error(error);
                window.showToast('Error de conexión', 'error'); 
                btn.innerHTML = 'Ingresar'; 
                btn.disabled = false; 
            }
        };



        window.appSignOut = () => {
            sessionStorage.removeItem('hr_v2_session');
            window.appState.currentUser = null;
            document.getElementById('app-layout').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-cedula').value = '';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            const btn = document.getElementById('login-btn');
            btn.innerHTML = 'Ingresar';
            btn.disabled = false;
        };

        window.setView = async (viewName) => {
            if (window.appState.currentUser.systemRole === 'WORKER' && viewName !== 'profile') return;
            window.appState.currentView = viewName;
            window.renderNav();
            
            const main = document.getElementById('main-content');
            if (viewName === 'dashboard') { main.innerHTML = window.renderDashboard(); lucide.createIcons(); }
            if (viewName === 'directory') { main.innerHTML = window.renderDirectory(); lucide.createIcons(); }
            if (viewName === 'ranking') { main.innerHTML = window.renderRanking(); lucide.createIcons(); }
            if (viewName === 'profile') {
                main.innerHTML = '<div class="flex justify-center items-center h-full pt-20"><i data-lucide="loader-2" class="w-10 h-10 animate-spin text-[#bb7434]"></i></div>';
                lucide.createIcons();
                
                const qDocs = query(collection(db, "documents"), where("workerId", "==", window.appState.selectedWorker.id));
                const snapDocs = await getDocs(qDocs);
                window.appState.currentProfileDocs = snapDocs.docs.map(doc => ({dbId: doc.id, ...doc.data()})).sort((a,b) => b.timestamp - a.timestamp);
                
                window.appState.activeProfileTab = 'rendimiento';
                main.innerHTML = window.renderProfile();
                lucide.createIcons();
            }
        };

        window.renderNav = () => {
            const role = window.appState.currentUser.systemRole;
            const desktopNav = document.getElementById('desktop-nav');
            const mobileNav = document.getElementById('mobile-nav');

            const navItems = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Inicio', roles: ['ADMIN', 'HR', 'COORD'] },
                { id: 'directory', icon: 'users', label: 'Directorio', roles: ['ADMIN', 'HR', 'COORD'] },
                { id: 'ranking', icon: 'star', label: 'Ranking', roles: ['ADMIN', 'HR', 'COORD'] },
                { id: 'profile', icon: 'user', label: 'Mi Perfil', roles: ['WORKER'] }
            ];

            const allowedItems = navItems.filter(item => item.roles.includes(role));

            // Desktop
            desktopNav.innerHTML = allowedItems.map(item => `
                <button onclick="window.setView('${item.id}')"
                    class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold transition-all ${window.appState.currentView === item.id ? 'bg-[#bb7434] text-white shadow-lg shadow-[#bb7434]/20' : 'text-gray-300 hover:bg-[#7a4a35] hover:text-white'}">
                    <i data-lucide="${item.icon}" class="w-5 h-5 shrink-0"></i> <span class="truncate">${item.label}</span>
                </button>
            `).join('');
            lucide.createIcons();

            // Mobile (Con botón de salir)
            let mobileHtml = allowedItems.map(item => `
                <button onclick="window.setView('${item.id}')" 
                    class="flex flex-col items-center gap-1 transition-colors ${window.appState.currentView === item.id ? 'text-[#542c1c]' : 'text-gray-400'}">
                    <div class="p-2 rounded-2xl transition-all ${window.appState.currentView === item.id ? 'bg-[#7be4af]/20' : ''}">
                        <i data-lucide="${item.icon}" class="w-5 h-5 shrink-0"></i>
                    </div>
                    <span class="text-[10px] font-bold">${item.label}</span>
                </button>
            `).join('');

            mobileHtml += `
                <button onclick="window.appSignOut()" class="flex flex-col items-center gap-1 transition-colors text-red-400">
                    <div class="p-2 rounded-2xl transition-all"><i data-lucide="log-out" class="w-5 h-5 shrink-0"></i></div>
                    <span class="text-[10px] font-bold">Salir</span>
                </button>
            `;
            mobileNav.innerHTML = mobileHtml;
            lucide.createIcons();
        };

        window.renderDashboard = () => {
            const activeWorkers = window.appState.dbWorkers.filter(w => w.status === 'activo').length;
            const firstName = window.appState.currentUser.name.split(' ')[0];
            
            const monthStr = window.appState.selectedMonth;
            const monthPoints = window.appState.points.filter(p => {
                const d = new Date(p.timestamp);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === monthStr;
            });
            let totalMonthPts = 0; monthPoints.forEach(p => totalMonthPts += (p.type === 'pos' ? p.amount : -p.amount));
            const avgPoints = activeWorkers > 0 ? Math.round(totalMonthPts / activeWorkers) : 0;

            // Obtener colaborador del mes anterior
            const now = new Date();
            const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1);
            const prevMonthStr = `${prevMonth.getFullYear()}-${String(prevMonth.getMonth()+1).padStart(2,'0')}`;
            const prevMonthPoints = window.appState.points.filter(p => {
                const d = new Date(p.timestamp);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === prevMonthStr;
            });
            const prevScores = {}; 
            window.appState.dbWorkers.forEach(w => prevScores[w.id] = 0); 
            prevMonthPoints.forEach(p => prevScores[p.workerId] += (p.type === 'pos' ? p.amount : -p.amount));
            const topWorkerPrev = window.appState.dbWorkers.filter(w => w.status === 'activo').sort((a,b) => prevScores[b.id] - prevScores[a.id])[0];
            const topWorkerPrevPts = topWorkerPrev ? prevScores[topWorkerPrev.id] : 0;

            return `
            <div class="animate-in fade-in space-y-5 sm:space-y-7 md:space-y-8">
                <div class="bg-[#542c1c] -mx-4 sm:-mx-5 md:-mx-6 lg:-mx-8 -mt-4 sm:-mt-5 md:-mt-6 lg:-mt-8 pt-10 sm:pt-12 md:pt-14 pb-8 sm:pb-10 md:pb-12 px-4 sm:px-6 md:px-10 rounded-b-[2rem] shadow-sm">
                    <div class="max-w-7xl mx-auto">
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white tracking-tight mb-1 truncate">Hola, ${firstName}</h1>
                        <p class="text-[#cab2a2] text-xs sm:text-sm font-medium mb-6 sm:mb-8">Resumen del mes actual</p>
                        <div class="flex gap-6 sm:gap-12">

                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100">
                            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Cumpleaños</p><p class="text-xs sm:text-sm font-medium text-gray-800">${w.birthday || '-'}</p></div>
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Email</p><p class="text-xs sm:text-sm font-medium text-gray-800 truncate">${w.email || '-'}</p></div>
                            </div>
                        </div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100">
                            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Sangre</p><p class="text-xs sm:text-sm font-medium text-gray-800">${w.bloodType || '-'}</p></div>
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">EPS</p><p class="text-xs sm:text-sm font-medium text-gray-800">${w.eps || '-'}</p></div>
                            </div>
                        </div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100"><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Dirección</p><p class="text-xs sm:text-sm font-medium text-gray-800 break-words">${w.address || '-'}</p></div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100">
                            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Emergencia</p><p class="text-xs sm:text-sm font-medium text-gray-800">${w.emergencyName || '-'}</p></div>
                                <div><p class="text-[10px] sm:text-xs font-bold text-gray-400 mb-1 uppercase tracking-wide">Tel. Emerg.</p><p class="text-xs sm:text-sm font-medium text-gray-800 truncate">${w.emergencyPhone || '-'}</p></div>
                            </div>
                        </div>
                    </div>

                    <!-- DOCUMENTOS -->
                    <div id="tab-documentos" class="${window.appState.activeProfileTab === 'documentos' ? 'block' : 'hidden'}">
                        ${canEdit ? `
                        <div class="mb-2 sm:mb-3 text-right">
                            <label class="bg-[#146459] text-white px-3 sm:px-4 py-2 sm:py-2.5 rounded-lg sm:rounded-xl text-xs sm:text-sm font-bold cursor-pointer inline-flex items-center gap-1 sm:gap-2 shadow-sm hover:opacity-90 transition-opacity">
                                <i data-lucide="upload" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Subir PDF</span>
                                <input type="file" accept="application/pdf" class="hidden" onchange="uploadDocument(event)">
                            </label>
                        </div>` : ''}
                        <div class="space-y-1.5 sm:space-y-2">${dList || '<p class="text-xs sm:text-sm text-gray-400 text-center py-4">Sin documentos</p>'}</div>
                    </div>

                    <!-- BANCO -->
                    ${canEdit ? `
                    <div id="tab-banco" class="${window.appState.activeProfileTab === 'banco' ? 'block' : 'hidden'} space-y-2.5 sm:space-y-3">
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100"><p class="text-[10px] sm:text-xs uppercase font-bold text-gray-400 mb-1 tracking-wide">Banco</p><p class="text-xs sm:text-sm font-medium text-gray-800 break-words">${w.bankName || '-'}</p></div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100"><p class="text-[10px] sm:text-xs uppercase font-bold text-gray-400 mb-1 tracking-wide">Tipo</p><p class="text-xs sm:text-sm font-medium text-gray-800 break-words">${w.bankType || '-'}</p></div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100 flex items-center gap-3 sm:gap-4">
                            <div class="flex-1 min-w-0"><p class="text-[10px] sm:text-xs uppercase font-bold text-gray-400 mb-1 tracking-wide">N° Cuenta</p><p class="text-sm sm:text-base md:text-lg font-black text-[#542c1c] truncate">${w.bankNumber || '-'}</p></div>
                            ${w.bankNumber ? `<button onclick="copyToClipboard('${w.bankNumber}')" class="bg-gray-100 w-9 h-9 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl text-gray-500 hover:bg-gray-200 transition-colors shrink-0 flex items-center justify-center active:scale-90"><i data-lucide="copy" class="w-4 h-4 sm:w-4.5 sm:h-4.5"></i></button>` : ''}
                        </div>
                        <div class="bg-white md:bg-gray-50 p-3.5 sm:p-4 md:p-5 rounded-lg sm:rounded-2xl card-shadow md:shadow-none md:border md:border-gray-100"><p class="text-[10px] sm:text-xs uppercase font-bold text-gray-400 mb-1 tracking-wide">Titular</p><p class="text-xs sm:text-sm font-medium text-gray-800 break-words">${w.bankOwner || '-'}</p></div>
                    </div>` : ''}
                </div>
            </div>`;
        };

        window.switchTab = (tabId) => {
            window.appState.activeProfileTab = tabId;
            ['rendimiento', 'laboral', 'documentos', 'banco'].forEach(t => {
                const content = document.getElementById(`tab-${t}`); const btn = document.getElementById(`tab-btn-${t}`);
                if(content && btn) {
                    if(t === tabId) { 
                        content.classList.remove('hidden'); content.classList.add('block'); 
                        btn.classList.add('text-[#542c1c]', 'border-[#542c1c]'); btn.classList.remove('text-gray-400', 'border-transparent'); 
                    } else { 
                        content.classList.remove('block'); content.classList.add('hidden'); 
                        btn.classList.remove('text-[#542c1c]', 'border-[#542c1c]'); btn.classList.add('text-gray-400', 'border-transparent'); 
                    }
                }
            });
        };

        window.openWhatsApp = (phone) => { window.open(`https://wa.me/57${phone}`, '_blank'); };

        window.savePoint = async () => {
            const amount = parseInt(document.getElementById('pt-amount').value);
            const type = document.getElementById('pt-type').value;
            const reason = document.getElementById('pt-reason').value.trim();
            if(!amount || !reason) return window.showToast('Ingresa cantidad y motivo', 'error');
            try { 
                const newPoint = { workerId: window.appState.selectedWorker.id, amount, type, reason, evaluator: window.appState.currentUser.name, timestamp: Date.now() };
                const docRef = await addDoc(collection(db, "points"), newPoint); 
                window.appState.points.push({dbId: docRef.id, ...newPoint}); 
                window.showToast('Evaluación guardada'); 
                window.setView('profile'); 
            } catch (e) { window.showToast('Error', 'error'); }
        };

        window.uploadDocument = (e) => {
            const file = e.target.files[0];
            if (!file || file.size > 1024 * 1024) return window.showToast('El PDF debe pesar máximo 1MB', 'error');
            window.showToast('Subiendo documento...');
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try { 
                    await addDoc(collection(db, "documents"), { workerId: window.appState.selectedWorker.id, name: file.name.replace('.pdf',''), file: ev.target.result, timestamp: Date.now() }); 
                    window.showToast('Documento guardado'); 
                    window.setView('profile'); 
                } catch (er) { window.showToast('Error al subir', 'error'); }
            }; reader.readAsDataURL(file);
        };

        window.deleteDocFile = async (id) => { 
            if(!confirm('¿Eliminar este documento?')) return; 
            await deleteDoc(doc(db, "documents", id)); 
            window.setView('profile'); 
        };

        window.copyToClipboard = (txt) => { navigator.clipboard.writeText(txt); window.showToast('Cuenta copiada'); };

        window.openWorkerForm = (id = null) => {
            document.getElementById('worker-form').reset(); 
            document.getElementById('w-photo-preview').classList.add('hidden'); 
            document.getElementById('w-photo-icon').classList.remove('hidden'); 
            document.getElementById('w-photo-base64').value = '';
            document.querySelectorAll('.w-availability-day').forEach(cb => cb.checked = false);
            
            const canSeeBank = ['ADMIN', 'HR'].includes(window.appState.currentUser.systemRole); 
            document.getElementById('bank-section-form').style.display = canSeeBank ? 'block' : 'none';

            if (id) {
                const w = window.appState.dbWorkers.find(x => x.id === id);
                document.getElementById('worker-modal-title').innerText = 'Editar Colaborador'; 
                document.getElementById('w-id').value = w.id; 
                document.getElementById('w-name').value = w.name || ''; 
                document.getElementById('w-lastname').value = w.lastname || '';
                document.getElementById('w-birthday').value = w.birthday || '';
                document.getElementById('w-doc').value = w.document; 
                document.getElementById('w-email').value = w.email || '';
                document.getElementById('w-phone').value = w.phone || ''; 
                document.getElementById('w-bloodtype').value = w.bloodType || '';
                document.getElementById('w-eps').value = w.eps || '';
                document.getElementById('w-address').value = w.address || '';
                document.getElementById('w-city').value = w.city || ''; 
                document.getElementById('w-emergency-name').value = w.emergencyName || '';
                document.getElementById('w-emergency-phone').value = w.emergencyPhone || '';
                document.getElementById('w-role').value = w.role; 
                document.getElementById('w-status').value = w.status; 
                document.getElementById('w-specs').value = w.specialties || '';
                
                if(w.availabilityDays) {
                    w.availabilityDays.forEach(day => {
                        const checkbox = document.querySelector(`.w-availability-day[value="${day}"]`);
                        if(checkbox) checkbox.checked = true;
                    });
                }
                if(w.availabilityTime) {
                    document.getElementById('w-availability-time').value = w.availabilityTime;
                }
                
                if(w.photo){ 
                    document.getElementById('w-photo-base64').value = w.photo; 
                    document.getElementById('w-photo-preview').src = w.photo; 
                    document.getElementById('w-photo-preview').classList.remove('hidden'); 
                    document.getElementById('w-photo-icon').classList.add('hidden');
                }
                
                if(canSeeBank){ 
                    document.getElementById('w-bank-name').value = w.bankName||''; 
                    document.getElementById('w-bank-type').value = w.bankType||'Ahorros'; 
                    document.getElementById('w-bank-num').value = w.bankNumber||''; 
                    document.getElementById('w-bank-owner').value = w.bankOwner||'';
                }
            } else { 
                document.getElementById('worker-modal-title').innerText = 'Nuevo Colaborador'; 
                document.getElementById('w-id').value = ''; 
            }
            document.getElementById('worker-modal').classList.add('active');
        };

        window.closeWorkerModal = () => { document.getElementById('worker-modal').classList.remove('active'); };
        
        window.handlePhotoUpload = (e) => { 
            const file = e.target.files[0]; 
            if(file && file.size < 800000) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    document.getElementById('w-photo-base64').value = ev.target.result; 
                    document.getElementById('w-photo-preview').src = ev.target.result; 
                    document.getElementById('w-photo-preview').classList.remove('hidden'); 
                    document.getElementById('w-photo-icon').classList.add('hidden'); 
                }; 
                reader.readAsDataURL(file); 
            } else {
                window.showToast('La foto debe pesar máximo 800KB', 'error');
            }
        };

        window.deleteWorker = async (id) => {
            if (!confirm('¿Estás seguro de eliminar este colaborador irremediablemente?')) return;
            try {
                await deleteDoc(doc(db, "workers", id));
                window.appState.dbWorkers = window.appState.dbWorkers.filter(w => w.id !== id);
                window.showToast('Colaborador eliminado');
                window.setView('directory');
            } catch (e) { window.showToast('Error al eliminar', 'error'); }
        };

        window.saveWorker = async (e) => {
            e.preventDefault();
            const formId = document.getElementById('w-id').value; 
            const btn = document.getElementById('save-worker-btn');
            
            const availableDays = Array.from(document.querySelectorAll('.w-availability-day:checked')).map(cb => cb.value);
            const availabilityTime = document.getElementById('w-availability-time').value;
            
            const workerData = { 
                id: formId || 'w_' + Date.now(), 
                name: document.getElementById('w-name').value, 
                lastname: document.getElementById('w-lastname').value,
                birthday: document.getElementById('w-birthday').value,
                document: document.getElementById('w-doc').value, 
                email: document.getElementById('w-email').value,
                phone: document.getElementById('w-phone').value, 
                bloodType: document.getElementById('w-bloodtype').value,
                eps: document.getElementById('w-eps').value,
                address: document.getElementById('w-address').value,
                city: document.getElementById('w-city').value, 
                emergencyName: document.getElementById('w-emergency-name').value,
                emergencyPhone: document.getElementById('w-emergency-phone').value,
                role: document.getElementById('w-role').value, 
                status: document.getElementById('w-status').value, 
                availabilityDays: availableDays,
                availabilityTime: availabilityTime,
                availabilityText: availableDays.length > 0 ? `${availableDays.join(', ')} desde ${availabilityTime}` : '',
                specialties: document.getElementById('w-specs').value, 
                photo: document.getElementById('w-photo-base64').value 
            };
            
            // Asignar systemRole según role seleccionado (para la navegación)
            if(workerData.role === 'Administrador') workerData.systemRole = 'ADMIN';
            else if(workerData.role === 'Colaborador') workerData.systemRole = 'WORKER';
            else workerData.systemRole = 'WORKER';

            if (['ADMIN', 'HR'].includes(window.appState.currentUser.systemRole)) { 
                workerData.bankName = document.getElementById('w-bank-name').value; 
                workerData.bankType = document.getElementById('w-bank-type').value; 
                workerData.bankNumber = document.getElementById('w-bank-num').value; 
                workerData.bankOwner = document.getElementById('w-bank-owner').value; 
            } else if (formId) { 
                const old = window.appState.dbWorkers.find(w => w.id === formId); 
                if (old) { 
                    workerData.bankName = old.bankName; 
                    workerData.bankType = old.bankType; 
                    workerData.bankNumber = old.bankNumber; 
                    workerData.bankOwner = old.bankOwner; 
                } 
            }
            
            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mx-auto"></i>'; lucide.createIcons();
            
            try { 
                await setDoc(doc(db, "workers", workerData.id), workerData); 
                window.closeWorkerModal(); 
                window.showToast('Colaborador guardado con éxito'); 
                await fetchAllData(); 
                if(window.appState.currentView === 'directory') window.setView('directory'); 
                if(window.appState.currentView === 'profile') window.setView('profile'); 
            } catch(e) { window.showToast('Error al guardar', 'error'); } 
            finally { btn.disabled = false; btn.innerText = 'Guardar'; }
        };
    </script>
</body>
</html>
